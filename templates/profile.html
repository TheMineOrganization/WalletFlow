{% extends "base.html" %}{% block title %}Profile{% endblock %}{% block content %}<div class="heading"><div><small>ACCOUNT</small><h1>Profile</h1></div></div><div class="card formcard"><form method="POST"><label>Name</label><input name="name" value="{{current_user.name}}" required><label>Email</label><input value="{{current_user.email}}" disabled><label>Phone</label><input name="phone" value="{{current_user.phone or ''}}"><label>Address</label><input name="address" value="{{current_user.address or ''}}"><button class="btn primary">Save changes</button></form></div>{% endblock %}
