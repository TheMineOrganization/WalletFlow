services:
  - type: web
    name: bitbuy-bitcoin-wallet
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && gunicorn --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 100 --timeout 120 app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BTC_DEPOSIT_ADDRESS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BTC_USD_RATE
        sync: false
