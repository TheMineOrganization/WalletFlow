services:
  - type: web
    name: walletflow
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 100 --timeout 120 app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: walletflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BTC_DEPOSIT_ADDRESS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: walletflow-db
